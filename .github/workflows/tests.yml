name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "release-notes/**"
      - "Resources/logo.svg"
      - ".github/FUNDING.yml"
      - "docs/**"
      - "scripts/build_site.py"
      - "scripts/make_site_images.py"
  pull_request:
    paths-ignore:
      - "**.md"
      - "release-notes/**"
      - "Resources/logo.svg"
      - ".github/FUNDING.yml"
      - "docs/**"
      - "scripts/build_site.py"
      - "scripts/make_site_images.py"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift --version && swift build --build-tests

      - name: Test
        # the tests mostly wait on simulated serial timing, so they run side by side
        run: swift test --skip-build --parallel

  app:
    name: app bundle (universal)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app bundle
        run: ./scripts/build_app.sh
